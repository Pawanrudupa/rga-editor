<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22c55e" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f97316" flood-opacity="0.5"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Gradients -->
  <rect width="1280" height="720" fill="#0f172a"/>
  <circle cx="150" cy="120" r="300" fill="#38bdf8" opacity="0.04"/>
  <circle cx="1150" cy="600" r="280" fill="#a855f7" opacity="0.04"/>

  <!-- Top Header Bar -->
  <g transform="translate(60, 40)">
    <text x="0" y="32" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="-0.5">RGA Collaborative Text Editor</text>
    <text x="0" y="54" fill="#94a3b8" font-size="13">Zero-Dependency CRDT • Offline-First • Multi-Tab &amp; WebRTC P2P</text>

    <!-- Status Pills -->
    <g transform="translate(480, 10)">
      <!-- Site ID -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-size="12">Site: <tspan fill="#38bdf8" font-weight="600">site-a4f1</tspan></text>

      <!-- P2P Status -->
      <rect x="177" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="195" cy="17" r="5" fill="#22c55e" filter="url(#glow-green)"/>
      <text x="210" y="22" fill="#f8fafc" font-size="12" font-weight="600">Connected (P2P)</text>

      <!-- Transport -->
      <rect x="349" y="0" width="220" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="363" y="22" fill="#94a3b8" font-size="12">Sync: <tspan fill="#f8fafc">Broadcast + WebRTC</tspan></text>

      <!-- Offline Queue -->
      <rect x="581" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="598" cy="17" r="4" fill="#94a3b8"/>
      <text x="612" y="22" fill="#94a3b8" font-size="12">Queue: <tspan fill="#22c55e" font-weight="600">0 ops</tspan></text>
    </g>
  </g>

  <!-- Main Editor Card -->
  <g transform="translate(60, 120)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="1160" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Editor Header -->
    <path d="M 0 12 Q 0 0 12 0 L 1148 0 Q 1160 0 1160 12 L 1160 42 L 0 42 Z" fill="#182234"/>
    <line x1="0" y1="42" x2="1160" y2="42" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" fill="#94a3b8" font-size="12" font-weight="600">DOCUMENT EDITOR</text>
    <text x="1140" y="26" fill="#64748b" font-size="12" text-anchor="end">Ln 6, Col 43</text>

    <!-- Document Content -->
    <g transform="translate(30, 75)" font-size="15" fill="#f8fafc" letter-spacing="0">
      <text x="0" y="0" font-weight="600" fill="#38bdf8">RGA CRDT Editor — Zero-Dependency Collaborative Editing</text>
      
      <text x="0" y="34" fill="#e2e8f0">• Multi-tab synchronization via native BroadcastChannel API</text>
      
      <text x="0" y="68" fill="#e2e8f0">• Cross-device P2P sync via WebRTC DataChannel (Vanilla ICE)</text>
      
      <text x="0" y="102" fill="#e2e8f0">• Offline queueing &amp; causal replay via browser IndexedDB</text>
      
      <text x="0" y="136" fill="#e2e8f0">• Hand-written Canvas QR code encoder (GF(2^8) Reed-Solomon)</text>
      
      <text x="0" y="170" fill="#e2e8f0">• Ephemeral collaborative presence cursors with live position tracking</text>

      <!-- Local Caret -->
      <rect x="585" y="154" width="2" height="20" fill="#38bdf8"/>

      <!-- Remote Cursor 1 (Pink) -->
      <g transform="translate(488, 52)">
        <rect x="0" y="0" width="2" height="20" fill="#f472b6"/>
        <rect x="-2" y="-18" width="62" height="18" rx="3" fill="#f472b6"/>
        <text x="4" y="-5" fill="#0f172a" font-size="10" font-weight="700">site-b8f2</text>
      </g>

      <!-- Remote Cursor 2 (Emerald) -->
      <g transform="translate(470, 86)">
        <rect x="0" y="0" width="2" height="20" fill="#34d399"/>
        <rect x="-2" y="-18" width="62" height="18" rx="3" fill="#34d399"/>
        <text x="4" y="-5" fill="#0f172a" font-size="10" font-weight="700">site-e4a1</text>
      </g>
    </g>

    <!-- Editor Footer Metrics -->
    <line x1="0" y1="290" x2="1160" y2="290" stroke="#334155" stroke-width="1"/>
    <g transform="translate(25, 318)" font-size="12">
      <text x="0" y="0" fill="#94a3b8">Visible Chars: <tspan fill="#38bdf8" font-weight="700">284</tspan></text>
      <text x="160" y="0" fill="#94a3b8">Total RGA Nodes: <tspan fill="#34d399" font-weight="700">287</tspan></text>
      <text x="350" y="0" fill="#94a3b8">Tombstones: <tspan fill="#f97316" font-weight="700">3</tspan></text>
      <text x="500" y="0" fill="#94a3b8">Ops Generated: <tspan fill="#f8fafc" font-weight="700">290</tspan></text>
      <text x="680" y="0" fill="#94a3b8">Lamport Counter: <tspan fill="#a78bfa" font-weight="700">42</tspan></text>

      <!-- Run GC Button -->
      <g transform="translate(860, -14)">
        <rect x="0" y="0" width="80" height="24" rx="5" fill="#334155" stroke="#475569" stroke-width="1"/>
        <text x="40" y="16" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Run GC</text>
      </g>
      <text x="955" y="0" fill="#22c55e" font-size="11">Causally Safe</text>
    </g>
  </g>

  <!-- CRDT Memory Inspector Card -->
  <g transform="translate(60, 485)" filter="url(#card-shadow)">
    <rect width="1160" height="185" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Inspector Header -->
    <path d="M 0 12 Q 0 0 12 0 L 1148 0 Q 1160 0 1160 12 L 1160 38 L 0 38 Z" fill="#182234"/>
    <line x1="0" y1="38" x2="1160" y2="38" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" fill="#38bdf8" font-size="12" font-weight="700">CRDT MEMORY INSPECTOR — RGA Linked Nodes &amp; Tombstone Subtree</text>
    <text x="1140" y="24" fill="#94a3b8" font-size="12" text-anchor="end">▲ Expanded</text>

    <!-- Node Chain Chips -->
    <g transform="translate(20, 65)">
      <!-- Root Node -->
      <g transform="translate(0, 0)">
        <rect width="64" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="32" y="20" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">ROOT</text>
        <text x="32" y="34" fill="#64748b" font-size="9" text-anchor="middle">sentinel</text>
      </g>
      <line x1="64" y1="21" x2="80" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Node 'R' -->
      <g transform="translate(80, 0)">
        <rect width="64" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="32" y="20" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">'R'</text>
        <text x="32" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">a4f1:1</text>
      </g>
      <line x1="144" y1="21" x2="160" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Node 'G' -->
      <g transform="translate(160, 0)">
        <rect width="64" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="32" y="20" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">'G'</text>
        <text x="32" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">a4f1:2</text>
      </g>
      <line x1="224" y1="21" x2="240" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Node 'A' -->
      <g transform="translate(240, 0)">
        <rect width="64" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="32" y="20" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">'A'</text>
        <text x="32" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">a4f1:3</text>
      </g>
      <line x1="304" y1="21" x2="320" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Tombstone 1 (Orange) -->
      <g transform="translate(320, 0)" filter="url(#glow-orange)">
        <rect width="70" height="42" rx="6" fill="#451a03" stroke="#f97316" stroke-width="1.5"/>
        <text x="35" y="20" fill="#f97316" font-size="12" font-weight="700" text-anchor="middle">⚰ 'o'</text>
        <text x="35" y="34" fill="#fdba74" font-size="9" text-anchor="middle">a4f1:4</text>
      </g>
      <line x1="390" y1="21" x2="406" y2="21" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2"/>

      <!-- Tombstone 2 (Orange) -->
      <g transform="translate(406, 0)" filter="url(#glow-orange)">
        <rect width="70" height="42" rx="6" fill="#451a03" stroke="#f97316" stroke-width="1.5"/>
        <text x="35" y="20" fill="#f97316" font-size="12" font-weight="700" text-anchor="middle">⚰ 'l'</text>
        <text x="35" y="34" fill="#fdba74" font-size="9" text-anchor="middle">a4f1:5</text>
      </g>
      <line x1="476" y1="21" x2="492" y2="21" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2"/>

      <!-- Tombstone 3 (Orange) -->
      <g transform="translate(492, 0)" filter="url(#glow-orange)">
        <rect width="70" height="42" rx="6" fill="#451a03" stroke="#f97316" stroke-width="1.5"/>
        <text x="35" y="20" fill="#f97316" font-size="12" font-weight="700" text-anchor="middle">⚰ 'd'</text>
        <text x="35" y="34" fill="#fdba74" font-size="9" text-anchor="middle">a4f1:6</text>
      </g>
      <line x1="562" y1="21" x2="578" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Node ' ' -->
      <g transform="translate(578, 0)">
        <rect width="64" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="32" y="20" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">' '</text>
        <text x="32" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">a4f1:7</text>
      </g>
      <line x1="642" y1="21" x2="658" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Node 'C' -->
      <g transform="translate(658, 0)">
        <rect width="64" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="32" y="20" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">'C'</text>
        <text x="32" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">a4f1:8</text>
      </g>
      <line x1="722" y1="21" x2="738" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Node 'R' -->
      <g transform="translate(738, 0)">
        <rect width="64" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="32" y="20" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">'R'</text>
        <text x="32" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">a4f1:9</text>
      </g>
      <line x1="802" y1="21" x2="818" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Node 'D' -->
      <g transform="translate(818, 0)">
        <rect width="64" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="32" y="20" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">'D'</text>
        <text x="32" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">a4f1:10</text>
      </g>
      <line x1="882" y1="21" x2="898" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Node 'T' -->
      <g transform="translate(898, 0)">
        <rect width="64" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="32" y="20" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">'T'</text>
        <text x="32" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">a4f1:11</text>
      </g>
      <line x1="962" y1="21" x2="978" y2="21" stroke="#64748b" stroke-width="1.5"/>

      <!-- Ellipsis -->
      <g transform="translate(978, 0)">
        <rect width="70" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="35" y="26" fill="#64748b" font-size="16" text-anchor="middle">···</text>
      </g>
    </g>

    <text x="20" y="152" fill="#64748b" font-size="11">
      Legend: <tspan fill="#38bdf8">■</tspan> Root Sentinel  •  <tspan fill="#f8fafc">■</tspan> Active Node  •  <tspan fill="#f97316">■</tspan> Tombstone Node (preserved for concurrent insert anchoring)
    </text>
  </g>
</svg>
